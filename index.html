<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cmax — Setup</title>
  <meta name="description" content="My desk setup in 3D: click any piece of gear to see what it is and why I use it." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Cmax — my desk setup in 3D" />
  <meta property="og:description" content="Click any piece of gear to see what it is and why I use it." />
  <meta property="og:url" content="https://cmax-cmd.github.io/" />
  <meta property="og:image" content="https://cmax-cmd.github.io/img/og.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://cmax-cmd.github.io/img/og.jpg" />
  <meta name="theme-color" content="#07080c" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>

  <header class="brand">
    <p class="brand-kicker mono">// setup</p>
    <h1 id="owner-name">My Setup</h1>
    <p id="owner-tagline" class="brand-tagline"></p>
  </header>

  <nav class="gear-list" aria-label="Gear">
    <ul id="gear-list"></ul>
  </nav>

  <aside id="card" class="card" aria-live="polite" aria-hidden="true">
    <button class="card-close" id="card-close" aria-label="Close">✕</button>
    <div class="card-media" id="card-media"></div>
    <div class="card-thumbs" id="card-thumbs" hidden></div>
    <p class="card-credit mono" id="card-credit"></p>
    <div class="card-body">
      <p class="card-cat mono" id="card-cat"></p>
      <h2 id="card-name"></h2>
      <dl class="card-specs" id="card-specs"></dl>
      <p class="card-note" id="card-note"></p>
      <div class="card-actions">
        <a id="card-link" class="btn" target="_blank" rel="noopener">Product page ↗</a>
        <button class="btn btn-ghost btn-wide" id="card-inspect" type="button">Close-up</button>
        <span class="card-nav">
          <button class="btn btn-ghost" id="card-prev" aria-label="Previous item">←</button>
          <button class="btn btn-ghost" id="card-next" aria-label="Next item">→</button>
        </span>
      </div>
    </div>
  </aside>

  <div id="labels" class="labels" aria-hidden="true"></div>
  <button class="inspect-exit" id="inspect-exit" type="button">← Back to the desk</button>

  <div class="toolbar" role="toolbar" aria-label="Scene switches">
    <button id="tb-rgb" type="button" aria-pressed="true" title="RGB lighting">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="5"/><circle cx="8" cy="15" r="5"/><circle cx="16" cy="15" r="5"/></svg><span>RGB</span>
    </button>
    <button id="tb-lights" type="button" aria-pressed="true" title="Room lights">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg><span>Lights</span>
    </button>
    <button id="tb-sound" type="button" aria-pressed="true" title="Sound">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg><span>Sound</span>
    </button>
  </div>

  <div id="tooltip" class="tooltip mono" hidden></div>
  <p class="hint mono" id="hint">drag to orbit · scroll to zoom · click any gear</p>

  <div id="loader" class="loader">
    <div class="loader-bar"><span></span></div>
    <p class="mono" id="loader-text">booting desk…</p>
  </div>

  <script type="module" src="main.js"></script>
  <script>
    // If the 3D scene can't start (old browser, no WebGL, CDN blocked), say so instead of spinning forever.
    setTimeout(function () {
      if (window.__gearReady) return;
      document.getElementById("loader-text").textContent = "3D view couldn't load. Try a newer browser or check your connection.";
    }, 10000);
  </script>
</body>
</html>
